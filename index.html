<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11141b" />
    <style>
      html { background: #11141b; }
      html[data-theme="light"] { background: #c7ccd4; }
    </style>
    <script>
      // Restore an explicit choice before the first paint. New visitors get dark mode.
      try {
        if (localStorage.getItem('njen-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#c7ccd4';
        }
      } catch { /* The site works when browser storage is unavailable. */ }
    </script>
    <meta name="description" content="Nick Jensen — software and CNC programmer, aerospace master grinder, and prototype machinist. GitHub, LinkedIn, and contact." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nick Jensen · njen.io" />
    <meta property="og:description" content="Programming. Engineering. Precision manufacturing." />
    <meta property="og:url" content="https://njen.io/" />
    <meta property="og:site_name" content="njen.io" />
    <link rel="canonical" href="https://njen.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nick Jensen · njen.io</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width:40rem;margin:20vh auto;padding:2rem;font:1rem/1.6 system-ui;color:#fff;background:#11141b">
        <h1 style="font-weight:450;letter-spacing:-.041667em">NICK JENSEN</h1>
        <p><a style="color:#f4d087" href="https://github.com/5nik7">GitHub</a> · <a style="color:#f4d087" href="https://www.linkedin.com/in/5nik7">LinkedIn</a> · <a style="color:#f4d087" href="mailto:contact@njen.io">Email</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
